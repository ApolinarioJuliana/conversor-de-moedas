    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Conversor de Moedas</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
        <h2>Conversor de Moedas</h2>
        <label for="valoresReais">Valor a converter:</label>
        <input type="number" id="valoresReais" placeholder="Ex: 100">
<br/>
<br/>
        <label for="moedaOrigem">Moeda de Origem</label>
        <select id="moedaOrigem">
             <option value="BRL">Real(BRL)</option>
            <option value="USD">Dolar(USD)</option>
            <option value="EUR">Euro(EUR)</option>
             <option value="PYG">Guarani(PYG)</option>
         </select>
<br/>
<br/>
         <label for="moedaDestino"> Converter para:</label>
        <select id="moedaDestino">
             <option value="BRL">Real(BRL)</option>
            <option value="USD">Dolar(USD)</option>
            <option value="EUR">Euro(EUR)</option>
             <option value="PYG">Guarani(PYG)</option>
         </select>

         <button id="botaoconverter">Converter</button>

            <p id="resultado">O resultado da conversão:</p>
</div>
            <script src="script.js"></script>
        
    </body>
    </html>
